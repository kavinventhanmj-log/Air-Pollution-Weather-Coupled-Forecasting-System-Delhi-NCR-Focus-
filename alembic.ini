# AeroCast-NCR Alembic configuration.
#
# The app performs lightweight additive runtime migrations on startup
# (see backend/app/database.py::apply_migrations) so SQLite databases stay
# compatible without a rebuild. Alembic is provided here as an optional,
# independent migration tool for teams that prefer versioned schema scripts
# (especially when operating PostgreSQL in production).
#
# Autogenerate a revision against your target database:
#   alembic -x db_url=postgresql://... revision --autogenerate -m "desc"
# Apply pending revisions. `-x db_url=...` is authoritative: if it is blank or
# not a valid SQLAlchemy URL, resolution FAILS instead of silently falling back
# to DATABASE_URL (see backend/scripts/alembic_db_url.py).
#   alembic -x db_url=sqlite:///./dev.db upgrade head
#   alembic upgrade head

[alembic]
script_location = alembic

# Leave as "drivername" so env.py picks the URL up from the runtime config
# instead of hard-coding credentials in this file.
sqlalchemy.url = drivername://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S