name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and dev dependencies
        run: pip install -e ".[dev]"
      # Scope includes the operational-safety code, not just services/API/tests.
      # backend/scripts/* (alembic_db_url.py, backfill_fire_provenance.py, ...),
      # backend/conftest.py and alembic/env.py implement the fail-closed database
      # and provenance guards; leaving them unlinted means a silent regression in
      # them cannot fail the build. alembic/versions/* is deliberately excluded:
      # those are frozen historical migrations, covered by the `migrations` job,
      # which applies them to a real PostgreSQL instead. This exact scope is
      # asserted by backend/tests/unit/test_ci_lint_scope.py.
      - name: Lint (ruff, services/API/tests + operational-safety code)
        run: >-
          python -m ruff check backend/app backend/tests backend/conftest.py
          backend/scripts alembic/env.py
      - name: Run backend test suite
        run: python -m pytest backend/tests -q --tb=short

  migrations:
    name: Migrations on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aerocast
          POSTGRES_PASSWORD: aerocast_secret_2024
          POSTGRES_DB: aerocast_ncr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aerocast -d aerocast_ncr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://aerocast:aerocast_secret_2024@localhost:5432/aerocast_ncr
      # The service above is a throwaway CI database. The test harness refuses
      # a non-SQLite DATABASE_URL unless this explicit opt-in is set, so a
      # stray production URL can never let a test run drop live tables.
      AEROCAST_ALLOW_LIVE_TEST_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and dev dependencies
        run: pip install -e ".[dev]"
      - name: Apply Alembic migrations to a fresh PostgreSQL
        run: python -m alembic upgrade head
      - name: Verify migration is at head
        run: python -m alembic current
      # Includes test_b8d3_*.py, which builds a PostgreSQL database shaped like
      # the production defect (duplicate forecast rows, orphaned station rows,
      # no uniqueness constraint) and runs the real head migration against it.
      # That revision deletes rows, so it is only exercised here and never
      # against a live database.
      - name: Run integration/API/migration tests against PostgreSQL
        run: >-
          python -m pytest backend/tests/integration backend/tests/test_api.py
          backend/tests/unit/test_migration_integrity.py -q --tb=short -p no:cacheprovider

  frontend:
    name: Frontend build (tsc + vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build