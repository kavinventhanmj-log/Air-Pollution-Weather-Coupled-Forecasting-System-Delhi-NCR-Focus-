services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aerocast
      POSTGRES_PASSWORD: aerocast_secret_2024
      POSTGRES_DB: aerocast_ncr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerocast -d aerocast_ncr"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://aerocast:aerocast_secret_2024@db:5432/aerocast_ncr
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost
      NASA_FIRMS_MAP_KEY: ${NASA_FIRMS_MAP_KEY:-}
      LIVE_REFRESH_ENABLED: "true"
      LIVE_REFRESH_INTERVAL_HOURS: "3"
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ml:/app/ml:ro
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    healthcheck:
      # /api/health (liveness) not /health (readiness): /health round-trips
      # Postgres and can exceed this 5s timeout on a cold database, which would
      # mark a healthy container unhealthy and restart it in a loop.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
