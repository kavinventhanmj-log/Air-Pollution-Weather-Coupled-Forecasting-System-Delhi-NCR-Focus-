# AeroCast-NCR Render Blueprint
#
# Deploys the FastAPI backend as a long-running Web Service. The frontend is
# hosted separately on Vercel (see frontend/vercel.json).
#
# Usage:
#   1. Create a Neon (neon.tech) or Supabase PostgreSQL database and copy its
#      pooled/external connection string.
#   2. Import this repo on Render: New > Blueprint, or create the Web Service
#      manually using the same build/start commands below.
#   3. Fill in the `sync: false` secrets from the Render dashboard:
#        DATABASE_URL     = postgresql://user:pass@host/db?sslmode=require
#        CORS_ORIGINS     = https://<your-app>.vercel.app
#        SECRET_KEY       = a long random string (>=32 chars, and NOT the
#                           development placeholder in backend/app/config.py --
#                           a production boot now refuses to start with it)
#        NASA_FIRMS_MAP_KEY / DATA_GOV_API_KEY / IMD_API_KEY  (optional)
#
#   4. Deploy manually (autoDeploy is off -- see below). Read the deploy log:
#      the app now refuses to start on an insecure production configuration, so a
#      failed boot names the exact setting rather than serving predictably.
#
# NOTE ON THE PRE-DEPLOY MIGRATION: the current head revision b8d3f1a9c4e2
# deletes orphaned station-linked rows and collapses duplicate forecast rows in
# order to add UNIQUE(station_id, horizon_hours). Take and verify a database
# backup, and get explicit approval, before deploying a build that reaches that
# revision. `migrate_safely.py` will refuse to stamp a legacy database that
# cannot be shown to carry the required constraints.
#
# NOTE: The repo-root working directory is intentional. Uvicorn starts as
# `backend.app.main:app` so that `ml/`, `models/`, `data/` and `alembic.ini`
# resolve from the repository root (models/joblib files are not baked into a
# Docker image; they ship inside the git checkout).

services:
  - type: web
    name: aerocast-backend
    runtime: python
    plan: free
    # 3.12 matches .github/workflows/ci.yml, the Dockerfile and local
    # development. It was pinned to 3.11.9, so the deployed interpreter was the
    # one version combination nothing was ever tested against; pandas/numpy
    # resolution differed from CI and a green run proved nothing about the
    # service that actually served traffic.
    pythonVersion: 3.12
    # DB-free liveness probe. `/health` additionally round-trips Postgres, so
    # pointing readiness at it makes Render keep the service "not ready" while a
    # pooled/free database is still waking. `/api/health` returns as soon as the
    # process accepts connections; database readiness is proven by the data
    # endpoints themselves, which now retry on transient failures.
    healthCheckPath: /api/health
    # Deploys are triggered manually.
    #
    # `preDeployCommand` runs `migrate_safely.py`, and the head revision
    # b8d3f1a9c4e2 deletes orphaned station-linked rows and collapses duplicate
    # forecast rows in order to add UNIQUE(station_id, horizon_hours). That is
    # irreversible, and autoDeploy would apply it to the live database the
    # moment anything was pushed -- with no backup taken and no operator in the
    # loop. The SIH26082 release also requires an explicit approval plus a
    # verified backup before that revision reaches production.
    #
    # With autoDeploy off, a push cannot mutate the database. Turn it back on
    # only once the migration has been reviewed and the backup verified.
    autoDeploy: false
    buildCommand: pip install -r backend/requirements.txt
    # Apply schema migrations before the new release starts serving. Without this
    # the app boots against a stale schema and every request that touches a new
    # column (re_stamped, forecast_runs) fails at runtime instead of at deploy.
    # `migrate_safely.py` rather than a bare `alembic upgrade head`: deployments
    # created before this chain was fixed ran against a database with no
    # `alembic_version` table (see Database & Migrations in the README), and a
    # bare upgrade replays the whole chain against existing tables and fails.
    # The script detects that state and stamps instead. `alembic/env.py` puts
    # backend/ first on sys.path so the repo-root `app/` shim cannot shadow the
    # real package.
    preDeployCommand: python backend/scripts/migrate_safely.py
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        value: https://air-pollution-weather-coupled-forec-eight.vercel.app
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        sync: false
      - key: NASA_FIRMS_MAP_KEY
        sync: false
      - key: DATA_GOV_API_KEY
        sync: false
      - key: IMD_API_KEY
        sync: false
      - key: DEMO_USER_PASSWORD
        sync: false
      # The SIH26082 demo login. Unset, it still resolves to off in production
      # (see `Settings.demo_user_enabled`); this deployment explicitly opts the
      # demo account back on so reviewers can sign in and explore the portal.
      # The trade-off is accepted deliberately: the demo address and password
      # are published in this repository and serve the login-page hint via
      # GET /api/auth/demo, so anyone can authenticate as the analyst role.
      # A production boot does not refuse the flag, but warns loudly when it is
      # set.
      - key: ENABLE_DEMO_USER
        value: "true"
      - key: LIVE_REFRESH_ENABLED
        value: "true"
      - key: LIVE_REFRESH_INTERVAL_HOURS
        value: "3"
      # Synthetic self-hydration is off in production.
      #
      # This used to be "true", which re-stamped a copy of the bundled training
      # data into the last 24 hours whenever the database had no recent reading.
      # The dashboard then rendered rows that looked like live sensor
      # measurements. `Settings.demo_hydration_enabled` is now False whenever the
      # environment is production, so this key cannot re-enable it; a production
      # boot also fails outright if it is set to true rather than quietly
      # ignoring the request.
      #
      # Real ingest comes from LIVE_REFRESH_ENABLED above. An empty database now
      # reports itself as empty instead of manufacturing history.
      - key: DEMO_HYDRATE_EMPTY_DB
        value: "false"
      # Cold-start cache pre-warm. The free tier wakes in ~76 s and the dashboard
      # then fans out ~14 requests, several of them ~11 s aggregations over the
      # pooled database; warming the TTL cache in the background after boot makes
      # the first load after a wake fast instead of a queue of cold queries.
      - key: CONTROL_ROOM_PREWARM
        value: "true"
